[package]
name = "mountain-view"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mountain_view_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
peakcore = { path = "../crates/peakcore" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tauri-plugin-geolocation = "2.3.2"
tauri-plugin-barometer = { path = "../plugins/barometer" }
tauri-plugin-camera = { path = "../plugins/camera" }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "rustls"] }
# Pinned with `=`: tauri-specta v2 is still pre-1.0 and its own docs warn that without
# an exact pin, a routine `cargo update` can pull an incompatible specta/tauri-specta
# pair and break the bindings build.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"

[[bin]]
name = "generate-bindings"
path = "src/bin/generate_bindings.rs"

