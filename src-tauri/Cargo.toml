[package]
name = "mountain-view"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mountain_view_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
peakcore = { path = "../crates/peakcore" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tauri-plugin-geolocation = "2.3.2"
tauri-plugin-barometer = { path = "../plugins/barometer" }
tauri-plugin-camera = { path = "../plugins/camera" }
# Only the DEM tile fetch uses this now, and that's a plain GET — the `form` feature went
# away with the Overpass POST when peaks moved to the bundled dataset.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
thiserror = "2"
# Camera frames arrive from the Swift plugin as base64 in a JSON channel payload; Tauri's
# Swift Channel only sends JSON, so there is no raw-bytes path to use instead.
base64 = "0.22"
# DEM tile fetching (dem.rs): async fs for the on-disk cache, spawn_blocking for the
# CPU-bound decode. Tauri already depends on tokio transitively; this just names it so
# dem.rs can use its API directly.
tokio = { version = "1", features = ["fs", "rt"] }
# Pinned with `=`: tauri-specta v2 is still pre-1.0 and its own docs warn that without
# an exact pin, a routine `cargo update` can pull an incompatible specta/tauri-specta
# pair and break the bindings build.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"
# The photo capture log (photolog.rs). `bundled` compiles SQLite from source rather than
# linking the system library: iOS ships its own libsqlite3, but bundling is the only thing
# that builds identically for the iOS targets and for the Linux host CI compiles for.
rusqlite = { version = "0.40.2", features = ["bundled"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
# photolog.rs's tests open real database files; this is where they put them.
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "generate-bindings"
path = "src/bin/generate_bindings.rs"

