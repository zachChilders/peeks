[package]
name = "peaklab"
version = "0.1.0"
edition = "2021"

# Desktop harness for the AR peak-identification pipeline. Deliberately independent of
# the Tauri app so the geometry can be iterated on against still photos.

[dependencies]
peakcore = { path = "../crates/peakcore" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tiff = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
image = "0.25"
imageproc = "0.25"
ab_glyph = "0.2"

[dev-dependencies]
sha2 = "0.10"
