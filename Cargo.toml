# Single Cargo workspace over every Rust crate in the repo.
#
# Before this, `peaklab` and `src-tauri` were independent packages with their own
# lockfiles and target dirs, which is what let the geodesy drift into a hand-written
# TypeScript copy in the first place: there was no shared crate to put it in.
[workspace]
members = ["crates/peakcore", "peaklab", "src-tauri", "plugins/*"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Profiles are only honoured on the workspace root; declaring this in a member is
# silently ignored (with a warning). Symbols in release builds make the desktop
# harness's profiles readable.
[profile.release]
debug = true
