[package]
name = "peakcore"
version = "0.1.0"
edition = "2021"

# Geodesy, camera projection, and Overpass query/parse — shared by peaklab (desktop) and
# src-tauri (mobile). Deliberately dependency-light: this compiles into the iOS static
# lib, so no reqwest/image/anyhow here, only what the math and parsing actually need.

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2"
